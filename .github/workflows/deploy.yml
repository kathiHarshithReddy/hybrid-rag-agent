name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    if: ${{ env.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx vercel --prod --token "$VERCEL_TOKEN"
